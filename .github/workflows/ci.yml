# Build and test gate for every PR and every push to main (issues #26, #87). The agent-context and labels workflows are separate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, boundaries, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint and formatting
        run: pnpm lint
      - name: Module boundaries (dependency-cruiser)
        run: pnpm deps:check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextdrop
          POSTGRES_PASSWORD: nextdrop
          POSTGRES_DB: nextdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextdrop -d nextdrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database; the suite requires a name ending in _test (prisma-rules.md).
      TEST_DATABASE_URL: postgresql://nextdrop:nextdrop@localhost:5432/nextdrop_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Integration tests
        run: pnpm test:int

  compose-smoke:
    name: Compose smoke (docker compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The judge path: no .env, every Compose default (README "Setup and configuration").
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for /api/readyz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/readyz; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::/api/readyz did not return 200 within 5 minutes"
          exit 1
      # The chips are compiled in by VITE_DEMO_MODE at build time (#108); DEMO_MODE defaults to true here.
      - name: The quick-login chips are built into the web app
        run: docker compose exec -T app grep -rq "nimal@waypoint.test" /repo/apps/web/dist/assets
      - name: The PWA is served from the same origin
        run: |
          headers=$(curl -fsS -D - -o /tmp/index.html http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi '^content-type: text/html'
          echo "$headers" | grep -qi '^cache-control: no-store'
          grep -q '<div id="root">' /tmp/index.html
      # The judge walkthrough and the axe smoke checks, in a real browser against the stack above (#62).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm e2e:install
      - name: Walkthrough and accessibility smoke (Playwright)
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
