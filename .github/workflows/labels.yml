name: labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/labels.json"]

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels from .github/labels.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const labels = JSON.parse(fs.readFileSync(".github/labels.json", "utf8"));
            for (const l of labels) {
              const params = { ...context.repo, name: l.name, color: l.color, description: l.description };
              try {
                await github.rest.issues.updateLabel(params);
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel(params);
              }
            }
