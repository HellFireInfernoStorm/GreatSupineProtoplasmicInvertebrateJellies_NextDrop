# Commands run in name order, so the numeric prefixes matter: sync the skills copy, rebuild the index, then check.
# Git hooks for every developer and every agent harness. CI runs the same checks (.github/workflows/agent-context.yml).
# Format and lint of staged source files are added with the monorepo skeleton (spec/build-order.md step 1).
pre-commit:
  parallel: false
  commands:
    1-sync-skills:
      run: node scripts/agent-context/sync-skills.mjs
      stage_fixed: true
    2-build-index:
      glob: "agent-docs/**/*.md"
      run: node scripts/agent-context/build-index.mjs
      stage_fixed: true
    3-agent-context:
      run: node scripts/agent-context/check.mjs

commit-msg:
  commands:
    subject:
      run: node scripts/agent-context/commit-msg.mjs {1}

pre-push:
  commands:
    branch-name:
      run: node scripts/agent-context/check-branch.mjs
    agent-context:
      run: node scripts/agent-context/check.mjs
    typecheck:
      run: pnpm -r --if-present run typecheck
    boundaries:
      run: pnpm run --if-present deps:check
    unit-tests:
      run: pnpm -r --if-present run test
